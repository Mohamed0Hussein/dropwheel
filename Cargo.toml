[workspace]
resolver = "3"
members = ["crates/core", "crates/wic", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
dropwheel-core = { path = "crates/core" }
dropwheel-wic = { path = "crates/wic" }
anyhow = "1.0.100"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Image codecs are painfully slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 2
