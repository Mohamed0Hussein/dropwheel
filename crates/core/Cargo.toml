[package]
name = "dropwheel-core"
description = "File operations behind Dropwheel. No UI, no Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
color_quant = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["rayon", "jpeg", "png", "webp", "bmp", "tiff", "gif", "ico", "avif"] }
img-parts = "0.4.1"
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.1"
png = "0.18.1"
tiff = "0.11.3"
webp = "0.3.1"

[target.'cfg(windows)'.dependencies]
dropwheel-wic.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
