<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dropwheel shelf</title>
    <link rel="stylesheet" href="/src/styles/shelf.css" />
  </head>
  <body>
    <main class="shelf" id="shelf" aria-label="Drop files here">
      <svg class="shelf__glyph" viewBox="0 0 40 40" aria-hidden="true">
        <circle class="shelf__ring" cx="20" cy="20" r="15" pathLength="80" />
        <circle class="shelf__ring shelf__ring--hot" cx="20" cy="20" r="15" pathLength="80" />
        <circle class="shelf__progress" cx="20" cy="20" r="15" pathLength="100" />
        <path class="shelf__arrow" d="M20 13.5v11m-4.5-4.5 4.5 4.5 4.5-4.5" />
      </svg>
      <span class="shelf__label" id="shelf-label" aria-live="polite">Drop files here</span>
    </main>
    <script type="module" src="/src/shelf.ts"></script>
  </body>
</html>
