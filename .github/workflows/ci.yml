name: Dropwheel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      # Also downloads PDFium into vendor/pdfium, which the app embeds and the
      # tests use.
      - name: Typecheck and build UI
        run: npm run build
        working-directory: ui

      - name: UI tests
        run: npm test
        working-directory: ui

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked
        env:
          DROPWHEEL_REQUIRE_PDFIUM: "1"

      - name: Third-party notices are up to date
        run: python scripts/make-notices.py --check

      - name: Build installers
        run: npm run tauri build
        working-directory: ui

      - uses: actions/upload-artifact@v5
        with:
          name: dropwheel-windows-x64
          path: |
            target/release/dropwheel.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
